[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Django-messenger"
version = "0.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Kirill Savostin", email = "savostn.c@yandex.ru" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
    "pytest>=9.1.1",
    "ty>=0.0.89",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]
src = ["src", "tests"]
exclude = [
    "**/.*",
    ".venv",
    "**/__pycache__",
    "dist",
    "build",
]