{% load static %}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        }
    </script>

    <title>{% block title %}Лосёво{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* === LIGHT THEME === */
        :root {
            --page-bg: #ebf0f5;
            --chat-bg: #f5f7f9;
            --pattern-color: rgba(0, 0, 0, 0.03);
            --pattern-size: 20px;

            --sidebar-bg: #ffffff;
            --header-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #7f91a4;
            --vk-blue: #4a76a8;
            --vk-border: #c5d0db;
            --active-chat-bg: #f0f2f5;
            --unread-bg: #e1e8f0;
        }

        /* === DARK THEME === */
        [data-bs-theme="dark"] {
            --page-bg: #1a1a1a;
            --chat-bg: #1c1c1c;
            --pattern-color: rgba(255, 255, 255, 0.03);

            --sidebar-bg: #222222;
            --header-bg: #222222;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --vk-border: #444444;
            --active-chat-bg: #333333;
            --unread-bg: #2a3441;
        }

        body {
            background-color: var(--page-bg);
            color: var(--text-main);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const icon = document.getElementById('themeIcon');
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');

            if (icon) {
                if (currentTheme === 'dark') {
                    icon.classList.remove('bi-moon-stars-fill');
                    icon.classList.add('bi-sun-fill');
                } else {
                    icon.classList.remove('bi-sun-fill');
                    icon.classList.add('bi-moon-stars-fill');
                }
            }
        });

        function toggleTheme() {
            const htmlTag = document.documentElement;
            const icon = document.getElementById('themeIcon');

            if (htmlTag.getAttribute('data-bs-theme') === 'light') {
                htmlTag.setAttribute('data-bs-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                if (icon) icon.classList.replace('bi-moon-stars-fill', 'bi-sun-fill');
            } else {
                htmlTag.setAttribute('data-bs-theme', 'light');
                localStorage.setItem('theme', 'light');
                if (icon) icon.classList.replace('bi-sun-fill', 'bi-moon-stars-fill');
            }
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
